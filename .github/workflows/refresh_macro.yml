name: Refresh Macro

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"  # weekly Monday; change later if needed

concurrency:
  group: refresh-macro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-macro:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DUCKDB_PATH: data/market.duckdb
      ARTIFACT_ROOT: artifacts/phasea

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Run Macro refresh
        run: python -m jobs.run_refresh_macro
