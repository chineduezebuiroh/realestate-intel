name: CES governed cohort source
on:
  workflow_call:
    inputs:
      cycle_id: {required: true, type: string}
      target_month: {required: true, type: string}
    secrets:
      BLS_API_KEY: {required: true}
    outputs:
      result_json:
        value: ${{ jobs.source.outputs.result_json }}
  workflow_dispatch:
    inputs:
      cycle_id: {description: Deterministic cycle ID, required: true, type: string}
      target_month: {description: Explicit governed cycle target month YYYY-MM, required: true, type: string}
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      result_json: ${{ steps.final.outputs.result_json }}
    env: {PYTHONPATH: ., OUTPUT_ROOT: artifacts/source_artifacts/ces/current_run}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Install governed dependencies
        run: pip install -r requirements.txt
      - id: prior
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: python -m jobs.monthly_refresh.ces_durable resolve-prior --repository "$GITHUB_REPOSITORY" --current-run-id "$GITHUB_RUN_ID" --workspace "$RUNNER_TEMP/prior" --output "$RUNNER_TEMP/prior.json" --github-output "$GITHUB_OUTPUT"
      - id: acquire
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          TARGET_MONTH: ${{ inputs.target_month }}
        run: |
          request_end_year="${TARGET_MONTH%%-*}"
          test "$request_end_year" -ge 1900
          start_year=$((request_end_year - 2))
          python -m jobs.monthly_refresh.ces_monthly --output-root "$OUTPUT_ROOT" \
            --prior-artifact '${{ steps.prior.outputs.prior_artifact }}' \
            --start-year "$start_year" --end-year "$request_end_year"
      - id: publish
        if: steps.acquire.outcome == 'success'
        continue-on-error: true
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: python -m jobs.monthly_refresh.ces_durable publish --repository "$GITHUB_REPOSITORY" --artifact "$OUTPUT_ROOT/artifact" --workspace "$RUNNER_TEMP/publication" --publisher-git-sha "$GITHUB_SHA" --output "$OUTPUT_ROOT/publication.json"
      - id: result
        if: always()
        env:
          CYCLE_ID: '${{ inputs.cycle_id }}'
          ACQUIRE_OUTCOME: '${{ steps.acquire.outcome }}'
          PUBLISH_OUTCOME: '${{ steps.publish.outcome }}'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from jobs.monthly_refresh.ces_result import build_result
          result=build_result(root=Path(os.environ['OUTPUT_ROOT']),cycle_id=os.environ['CYCLE_ID'],acquire_outcome=os.environ['ACQUIRE_OUTCOME'],publish_outcome=os.environ['PUBLISH_OUTCOME'])
          value=json.dumps(result,separators=(',',':'),sort_keys=True)
          open(os.environ['GITHUB_OUTPUT'],'a').write('result_json='+value+'\n'); print(value)
          PY
      - id: record
        name: Durably record governed successful cycle result
        if: steps.acquire.outcome == 'success' && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT_JSON: ${{ steps.result.outputs.result_json }}
        run: |
          printf '%s' "$RESULT_JSON" > "$RUNNER_TEMP/source-result.json"
          python -m jobs.monthly_refresh.cycle_results --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" --token "$GITHUB_TOKEN" --result "$RUNNER_TEMP/source-result.json" \
            --output "$OUTPUT_ROOT/cycle-result-recording.json"
      - id: final
        name: Publish result only after required durable recording
        if: always()
        env:
          RESULT_JSON: ${{ steps.result.outputs.result_json }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
        run: |
          test -n "$RESULT_JSON"
          if [ "$(jq -r .status <<<"$RESULT_JSON")" = succeeded ] && [ "$RECORD_OUTCOME" != success ]; then
            echo 'Successful source result was not durably recorded' >&2; exit 1
          fi
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
