name: ACS5 2023 read-only provider evidence
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: acs5-2023-provider-evidence
  cancel-in-progress: false
jobs:
  evidence:
    if: github.ref == 'refs/heads/main' && github.repository == 'chineduezebuiroh/realestate-intel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Capture and validate exact provider evidence
        env:
          PYTHONPATH: .
          CENSUS_API_KEY: '${{ secrets.CENSUS_API_KEY }}'
        run: python -m jobs.monthly_refresh.acs_provider_evidence --output "$RUNNER_TEMP/acs5-2023-evidence"
      - name: Evidence summary
        if: always()
        env:
          PILOT_OUTPUT: '${{ runner.temp }}/acs5-2023-evidence'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['PILOT_OUTPUT']) / 'summary.json'
          if path.exists():
              s = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write(f"ACS5 2023 provider evidence: validated={s['validated']}; "
                            f"captured responses={s['captured_responses']}; production writes=false.\n")
                  if s['validated']:
                      out.write(f"Accounting: {json.dumps(s['accounting'], sort_keys=True)}\n")
                  else:
                      out.write('Evidence is incomplete/invalid; review diagnostics before retry.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acs5-2023-provider-evidence
          path: ${{ runner.temp }}/acs5-2023-evidence/
          if-no-files-found: warn
          retention-days: 30
