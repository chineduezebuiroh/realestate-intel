name: Governed NRC physical candidate
on:
  workflow_dispatch:
    inputs:
      invocation_mode:
        description: Governed pin lifecycle mode
        required: true
        type: choice
        options: [normal, resume, replay]
      cycle_id:
        description: Exact isolated NRC-C cycle ID
        required: true
        type: string
permissions: {contents: write}
jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DURABLE_AUTHORITY_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          python -m jobs.monthly_refresh.nrc_hosted \
            --cycle-id '${{ inputs.cycle_id }}' --mode '${{ inputs.invocation_mode }}' \
            --repository "$GITHUB_REPOSITORY" --branch "$DURABLE_AUTHORITY_BRANCH" \
            --workspace "$RUNNER_TEMP/nrc" --output "$RUNNER_TEMP/result.json"
          cat "$RUNNER_TEMP/result.json" >> "$GITHUB_STEP_SUMMARY"
