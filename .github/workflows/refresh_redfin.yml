name: Refresh Redfin

on:
  workflow_dispatch:

concurrency:
  group: refresh-redfin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-redfin:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DUCKDB_PATH: data/market.duckdb
      ARTIFACT_ROOT: artifacts/phasea

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Enforce manual local Redfin gate
        run: |
          echo "Redfin v2 raw files are local-only and are not available to hosted refreshes."
          echo "waiting_for_manual_redfin"
