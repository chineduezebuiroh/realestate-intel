name: FRED governed monthly artifact acceptance

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: Governed target month (YYYY-MM)
        required: false
        type: string
      prior_artifact_path:
        description: Optional exact artifact/ directory override (takes precedence and must validate)
        required: false
        type: string

      activate_accepted_pointer:
        description: Explicitly activate the resulting cataloged FRED artifact (normally false for first publication review)
        required: false
        default: false
        type: boolean

  # Temporary acceptance bridge until governed orchestration is available on main.
  push:
    branches:
      - monthly-refresh-orchestration
    paths:
      - ".github/workflows/fred-monthly-artifact.yml"
      - "jobs/monthly_refresh/fred_macro.py"
      - "sources/fred_macro/**"
      - "jobs/monthly_refresh/fred_durable.py"
      - "config/artifact_catalog.json"
      - "scripts/smoke_tests/160_169/166_fred_monthly_artifact_runner.py"
      - "scripts/smoke_tests/160_169/167_fred_prior_actions_resolver.py"
      - "jobs/monthly_refresh/fred_prior_actions.py"

permissions:
  contents: write
  actions: read

jobs:
  fred-artifact:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      OUTPUT_ROOT: artifacts/source_artifacts/fred_macro/current_run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install governed dependencies
        run: pip install -r requirements.txt
      - name: Compile and fixture acceptance
        run: |
          python -m compileall -q core/source_artifacts sources/fred_macro jobs/monthly_refresh scripts/smoke_tests
          python scripts/smoke_tests/160_169/164_source_artifact_vertical_slice.py
          python scripts/smoke_tests/160_169/165_source_artifact_provenance.py
          python scripts/smoke_tests/160_169/166_fred_monthly_artifact_runner.py
          python scripts/smoke_tests/160_169/167_fred_prior_actions_resolver.py
          python scripts/smoke_tests/160_169/168_registry_contracts.py
          python scripts/smoke_tests/170_179/170_github_release_transport.py
          python scripts/smoke_tests/170_179/171_fred_durable_registry.py
      - name: Resolve and validate prior FRED artifact
        id: prior
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPLICIT_PRIOR: ${{ inputs.prior_artifact_path }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY" --current-run-id "$GITHUB_RUN_ID" --workspace "$RUNNER_TEMP/fred-prior" --output "$RUNNER_TEMP/prior_resolution.json" --github-output "$GITHUB_OUTPUT")
          if [ -n "$EXPLICIT_PRIOR" ]; then args+=(--explicit-path "$EXPLICIT_PRIOR"); fi
          python -m jobs.monthly_refresh.fred_durable resolve-prior "${args[@]}"
      - name: Acquire and validate ordinary-current FRED artifact
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TARGET_MONTH: ${{ inputs.target_month }}
          PRIOR_ARTIFACT: ${{ steps.prior.outputs.prior_artifact }}
        run: |
          test -n "$FRED_API_KEY" || { echo 'FRED_API_KEY repository secret is required'; exit 1; }
          args=(--output-root "$OUTPUT_ROOT")
          if [ -n "$TARGET_MONTH" ]; then args+=(--target-month "$TARGET_MONTH"); fi
          if [ -n "$PRIOR_ARTIFACT" ]; then args+=(--prior-artifact "$PRIOR_ARTIFACT"); fi
          python -m jobs.monthly_refresh.fred_macro "${args[@]}"
      - name: Stage prior-resolution evidence
        run: |
          cp "$RUNNER_TEMP/prior_resolution.json" "$OUTPUT_ROOT/prior_resolution.json"
      - name: Publish, catalog, and resolve exact durable FRED artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVATE: ${{ inputs.activate_accepted_pointer }}
        run: |
          args=(publish --repository "$GITHUB_REPOSITORY" --artifact "$OUTPUT_ROOT/artifact" --workspace "$RUNNER_TEMP/fred-publication" --publisher-git-sha "$GITHUB_SHA" --output "$OUTPUT_ROOT/publication.json")
          if [ "$ACTIVATE" = "true" ]; then args+=(--activate); fi
          python -m jobs.monthly_refresh.fred_durable "${args[@]}"
      - name: Safe workflow summary
        run: |
          jq --slurpfile prior "$OUTPUT_ROOT/prior_resolution.json" --slurpfile publication "$OUTPUT_ROOT/publication.json" '{schema_version:"fred_durable_acceptance_v1",source_id,run_status,source_change_detected,target_month,prior_resolution:$prior[0].resolution,prior_artifact_id,resulting_artifact_id,resulting_artifact_content_hash,data_sha256,package_sha256:$publication[0].package_sha256,release_tag:$publication[0].release_tag,release_id:$publication[0].release_id,asset_id:$publication[0].asset_id,asset_filename:$publication[0].asset_filename,publication_receipt_id:$publication[0].publication_receipt_id,publication_state:$publication[0].publication_state,catalog_changed:$publication[0].catalog_changed,accepted_pointer_changed:$publication[0].accepted_pointer_changed,durable_resolution_passed:$publication[0].durable_resolution_passed,historical_revision_count,new_key_count,prior_only_preserved_key_count}' "$OUTPUT_ROOT/run_report.json" | tee "$OUTPUT_ROOT/workflow_summary.json"
          {
            echo '### FRED governed source artifact'
            echo "- Git SHA: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            echo "- Target month: $(jq -r .target_month "$OUTPUT_ROOT/run_report.json")"
            echo '```json'
            cat "$OUTPUT_ROOT/workflow_summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Phase 2B acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: fred-governed-artifact-${{ inputs.target_month || 'inferred' }}-${{ github.sha }}
          path: artifacts/source_artifacts/fred_macro/current_run/
          if-no-files-found: error
          retention-days: 30
