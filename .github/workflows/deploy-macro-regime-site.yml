name: Deploy Macro Regime site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_ID: capital_markets_f4_production_20260818
      RELEASE_TAG: ${{ vars.MACRO_REGIME_ARTIFACT_RELEASE_TAG }}
      RELEASE_ASSET: ${{ vars.MACRO_REGIME_ARTIFACT_ASSET }}
      RELEASE_SHA256: ${{ vars.MACRO_REGIME_ARTIFACT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate governed artifact configuration
        run: |
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_ASSET"
          test -n "$RELEASE_SHA256"
      - name: Download immutable production publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$RELEASE_ASSET" --dir /tmp/macro-regime
      - name: Verify and extract production publish bundle
        run: |
          cd /tmp/macro-regime
          printf '%s  %s\n' "$RELEASE_SHA256" "$RELEASE_ASSET" | sha256sum --check --strict
          mkdir -p "$GITHUB_WORKSPACE/artifacts/regime/runs"
          tar -xzf "$RELEASE_ASSET" -C "$GITHUB_WORKSPACE/artifacts/regime/runs"
          test -d "$GITHUB_WORKSPACE/artifacts/regime/runs/$RUN_ID"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Build deployable site
        run: PYTHONPATH=. python -u scripts/build_macro_regime_site.py --run "artifacts/regime/runs/$RUN_ID" --output site
      - name: Deployment smoke
        run: PYTHONPATH=. python -u scripts/smoke_tests/100_109/108_macro_regime_static_deployment.py --run "artifacts/regime/runs/$RUN_ID"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
