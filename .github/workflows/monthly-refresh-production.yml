name: Governed monthly refresh production cohort
on:
  # Temporary Phase 3B hosted acceptance scaffolding. Remove after this workflow
  # is registered on the default branch; this is not the production schedule.
  push:
    branches: [monthly-refresh-orchestration]
    paths:
      - '.github/workflows/monthly-refresh-production.yml'
      - '.github/workflows/redfin-monthly-source.yml'
      - '.github/workflows/fred-monthly-source.yml'
      - 'jobs/monthly_refresh/cohort.py'
      - 'jobs/monthly_refresh/readiness.py'
      - 'jobs/monthly_refresh/redfin_resolver.py'
      - 'config/monthly_refresh_readiness.json'
      - 'config/monthly_refresh_policy.json'
      - 'docs/contracts/monthly_refresh_production_v1.md'
      - 'scripts/smoke_tests/170_179/175_monthly_source_cohort_orchestrator.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Governed invocation mode (never a force bypass)
        required: true
        default: normal
        type: choice
        options: [normal, resume, replay]
      redfin_drop_id: {description: Explicit registered drop ID (required for resume/replay), required: false, type: string}
      redfin_drop_content_hash: {description: Explicit registered drop content SHA-256, required: false, type: string}
      target_month: {description: Explicit target month YYYY-MM, required: false, type: string}
      cycle_id: {description: Explicit deterministic cycle ID (required for resume/replay), required: false, type: string}
# Saturday readiness cron intentionally disabled until Phase 3C+ acceptance.
permissions:
  contents: read
jobs:
  resolve-cycle:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    outputs:
      fan_out: ${{ steps.resolve.outputs.fan_out }}
      cycle_id: ${{ steps.resolve.outputs.cycle_id }}
      target_month: ${{ steps.resolve.outputs.target_month }}
      drop_id: ${{ steps.resolve.outputs.drop_id }}
      redfin_pin: ${{ steps.resolve.outputs.redfin_pin }}
      redfin_artifact_id: ${{ steps.resolve.outputs.redfin_artifact_id }}
      resume_redfin_result: ${{ steps.resolve.outputs.resume_redfin_result }}
      cycle_json: ${{ steps.resolve.outputs.cycle_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install governed dependencies
        run: pip install -r requirements.txt
      - id: resolve
        env:
          MODE: ${{ inputs.mode || 'normal' }}
          SUPPLIED_CYCLE: ${{ inputs.cycle_id }}
        run: |
          args=(--mode "$MODE" --output "$RUNNER_TEMP/cycle.json")
          if [ -n "$SUPPLIED_CYCLE" ]; then args+=(--cycle-id "$SUPPLIED_CYCLE"); fi
          python -m jobs.monthly_refresh.cohort resolve "${args[@]}"
          cat "$RUNNER_TEMP/cycle.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "fan_out=$(jq -r .fan_out "$RUNNER_TEMP/cycle.json")" >> "$GITHUB_OUTPUT"
          echo "cycle_id=$(jq -r '.cycle_id // empty' "$RUNNER_TEMP/cycle.json")" >> "$GITHUB_OUTPUT"
          echo "target_month=$(jq -r '.target_month // empty' "$RUNNER_TEMP/cycle.json")" >> "$GITHUB_OUTPUT"
          echo "drop_id=$(jq -r '.drop_id // empty' "$RUNNER_TEMP/cycle.json")" >> "$GITHUB_OUTPUT"
          echo "redfin_pin=$(jq -c '.redfin_candidate_pin // {}' "$RUNNER_TEMP/cycle.json")" >> "$GITHUB_OUTPUT"
          echo "redfin_artifact_id=$(jq -r '.redfin_candidate_pin.candidate_artifact_id // empty' "$RUNNER_TEMP/cycle.json")" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = resume ]; then
            python - <<'PY'
          import json, os
          from jobs.monthly_refresh.cohort import durable_redfin_result
          cycle=json.load(open(os.environ['RUNNER_TEMP']+'/cycle.json'))
          catalog=json.load(open('config/artifact_catalog.json'))
          value=json.dumps(durable_redfin_result(cycle=cycle,catalog=catalog),sort_keys=True,separators=(',',':'))
          open(os.environ['GITHUB_OUTPUT'],'a').write('resume_redfin_result='+value+'\n')
          PY
          else
            echo "resume_redfin_result=" >> "$GITHUB_OUTPUT"
          fi
          echo "cycle_json=$(jq -c . "$RUNNER_TEMP/cycle.json")" >> "$GITHUB_OUTPUT"
  redfin:
    needs: resolve-cycle
    if: needs.resolve-cycle.outputs.fan_out == 'true' && inputs.mode != 'resume'
    uses: ./.github/workflows/redfin-monthly-source.yml
    with:
      cycle_id: ${{ needs.resolve-cycle.outputs.cycle_id }}
      drop_id: ${{ needs.resolve-cycle.outputs.drop_id }}
      invocation_mode: ${{ inputs.mode }}
      candidate_artifact_id: ${{ needs.resolve-cycle.outputs.redfin_artifact_id }}
  fred:
    needs: resolve-cycle
    if: needs.resolve-cycle.outputs.fan_out == 'true'
    permissions: {contents: write}
    uses: ./.github/workflows/fred-monthly-source.yml
    with:
      cycle_id: ${{ needs.resolve-cycle.outputs.cycle_id }}
    secrets: inherit
  barrier:
    if: always() && needs.resolve-cycle.outputs.fan_out == 'true'
    needs: [resolve-cycle, redfin, fred]
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install governed dependencies
        run: pip install -r requirements.txt
      - env:
          CYCLE_JSON: ${{ needs.resolve-cycle.outputs.cycle_json }}
          REDFIN_RESULT: ${{ needs.redfin.outputs.result_json }}
          FRED_RESULT: ${{ needs.fred.outputs.result_json }}
          RESUME_REDFIN: ${{ needs.resolve-cycle.outputs.resume_redfin_result }}
        run: |
          printf '%s' "$CYCLE_JSON" > "$RUNNER_TEMP/cycle.json"
          args=(--cycle-json "$RUNNER_TEMP/cycle.json" --output "$RUNNER_TEMP/cohort.json")
          if [ -n "$REDFIN_RESULT" ]; then
            printf '%s' "$REDFIN_RESULT" > "$RUNNER_TEMP/redfin.json"; args+=(--result "$RUNNER_TEMP/redfin.json")
          elif [ -n "$RESUME_REDFIN" ]; then
            printf '%s' "$RESUME_REDFIN" > "$RUNNER_TEMP/resume-redfin.json"; args+=(--reused-result "$RUNNER_TEMP/resume-redfin.json")
          fi
          if [ -n "$FRED_RESULT" ]; then printf '%s' "$FRED_RESULT" > "$RUNNER_TEMP/fred.json"; args+=(--result "$RUNNER_TEMP/fred.json"); fi
          python -m jobs.monthly_refresh.cohort barrier "${args[@]}"
          cat "$RUNNER_TEMP/cohort.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: governed-monthly-cohort-${{ needs.resolve-cycle.outputs.cycle_id }}
          path: ${{ runner.temp }}/cohort.json
          if-no-files-found: error
          retention-days: 90
